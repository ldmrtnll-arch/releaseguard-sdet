name: releaseguard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-releaseguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-releaseguard_dev}
      POSTGRES_USER: ${POSTGRES_USER:-releaseguard}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/dist/migrate.js']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-releaseguard}:${POSTGRES_PASSWORD:-releaseguard_dev}@postgres:5432/${POSTGRES_DB:-releaseguard}
      JWT_SECRET: ${JWT_SECRET:-releaseguard-container-only-secret-change-me}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-releaseguard}:${POSTGRES_PASSWORD:-releaseguard_dev}@postgres:5432/${POSTGRES_DB:-releaseguard}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_SECRET: ${JWT_SECRET:-releaseguard-container-only-secret-change-me}
      NODE_ENV: production
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - '${WEB_PORT:-5173}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:8080/',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
